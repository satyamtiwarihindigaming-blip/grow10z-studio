name: GROW10Z Daily Ramayana 24/7 Automation (2 Reels Daily)

on:
  schedule:
    # Slot 1: Morning Reel at 03:30 UTC = 09:00 AM IST (Runs 24/7 when PC is ON or OFF)
    - cron: '30 3 * * *'
    # Slot 2: Evening Reel at 12:30 UTC = 06:00 PM IST (Runs 24/7 when PC is ON or OFF)
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Specific Episode ID to produce (leave blank for automatic next episode)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install FFmpeg, OpenGL/EGL, and Devanagari Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva fonts-lohit-deva wget libegl1 libgl1 libfontconfig1 libfreetype6 libglib2.0-0

      - name: ⚙️ Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install numpy soundfile scipy pillow skia-python kokoro-onnx playwright requests edge-tts
          playwright install --with-deps chromium

      - name: 🎙️ Download Kokoro Hindi Models
        run: |
          mkdir -p models
          if [ ! -f models/kokoro-v1.0.onnx ]; then
            echo "Downloading kokoro-v1.0.onnx..."
            wget -q -O models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          fi
          if [ ! -f models/voices-v1.0.bin ]; then
            echo "Downloading voices-v1.0.bin..."
            wget -q -O models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          fi

      - name: 🚀 Run Autonomous Daily Producer
        run: |
          python studio_ramayana/pipeline/auto_daily_producer.py ${{ github.event.inputs.episode_id }}

      - name: 📤 Upload Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-ready-deliverables
          path: |
            UPLOAD_READY_VIDEOS/*.mp4
            UPLOAD_READY_VIDEOS/*.txt

      - name: 🏷️ Determine Release Tag & Assets
        id: vars
        run: |
          LATEST_VIDEO=$(ls -t UPLOAD_READY_VIDEOS/*.mp4 | head -1)
          LATEST_TXT=$(ls -t UPLOAD_READY_VIDEOS/*.txt | head -1)
          TAG_NAME="episode-$(date +'%Y%m%d-%H%M%S')"
          echo "video_path=$LATEST_VIDEO" >> $GITHUB_OUTPUT
          echo "txt_path=$LATEST_TXT" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: 📦 Create Permanent GitHub Release (Direct Download Anywhere)
        uses: softprops/action-gh-release@v2
        if: steps.vars.outputs.video_path != ''
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "GROW10Z Ramayana Daily Episode - ${{ steps.vars.outputs.tag_name }}"
          body_path: ${{ steps.vars.outputs.txt_path }}
          files: |
            ${{ steps.vars.outputs.video_path }}
            ${{ steps.vars.outputs.txt_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📡 Run Cloud Publisher (Buffer -> Instagram @grow10z)
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN || 'DhMsR0Uslt8x2IUO_1F4nAUi2U5qelo7gDVexB3wZEJ' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RELEASE_VIDEO_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag_name }}/$(basename ${{ steps.vars.outputs.video_path }})"
          python studio_ramayana/pipeline/cloud_uploader.py "${{ steps.vars.outputs.video_path }}" "${{ steps.vars.outputs.txt_path }}" || true
          # Direct Buffer Instagram Publishing (Share Now)
          python -c "
          import sys, os
          from studio_ramayana.pipeline.buffer_publisher import create_instagram_post
          txt_file = '${{ steps.vars.outputs.txt_path }}'
          caption = ''
          if os.path.exists(txt_file):
              with open(txt_file, 'r', encoding='utf-8') as f:
                  caption = f.read()
          create_instagram_post(caption[:2100], video_url='${RELEASE_VIDEO_URL}', share_now=True)
          " || true

      - name: 💾 Commit & Push Progress
        run: |
          git config --global user.name "GROW10Z-Bot"
          git config --global user.email "bot@grow10z.com"
          git add studio_ramayana/episodes/episodes_database.json UPLOAD_READY_VIDEOS/ || true
          git commit -m "chore(auto): record completed episode [skip ci]" || echo "No changes to commit"
          git push
